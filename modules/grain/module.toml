# Grain: film grain in recorded pictures. The core applies the level of
# CORE.GRAIN in the native grain stage, so the module has only its page.
id = "GRAIN"
version = 1
# The default place in ADJ and in MENU: Film Look, Framing, Guides, Date, Grain.
order = 50
sources = []
# Tile n shows value n. Tile 0 is the module tile, for Off at the root.
tiles = [
    "tiles/0-module.png",
    "tiles/1-weak.png",
    "tiles/2-medium.png",
    "tiles/3-strong.png",
]
# CORE.GRAIN: 0 Off, 1 weak, 2 medium, 3 strong. CORE.GRAIN_SIZE: 0 Auto
# (by ISO), 1 small, 2 medium, 3 large.
uses = ["CORE.GRAIN", "CORE.GRAIN_SIZE"]

[page]
setting = "CORE.GRAIN"
off_row = true
# The level, then the size.
settings = ["CORE.GRAIN", "CORE.GRAIN_SIZE"]
