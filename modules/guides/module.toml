# Guides: composition guides over the still live view.
id = "GUIDES"
version = 1
sources = ["guides.c"]
# Tile n shows value n. Tile 0 is the module tile, for Off at the root.
tiles = [
    "tiles/0-module.png",
    "tiles/1-thirds.png",
    "tiles/2-center.png",
    "tiles/3-golden.png",
    "tiles/4-diagonals.png",
    "tiles/5-thirds-center.png",
]

# 0 Off, 1 thirds, 2 center, 3 golden ratio, 4 diagonals, 5 thirds and center.
[[settings]]
key = "STYLE"
values = 6
saved = true
public = true

[page]
setting = "STYLE"
off_row = true

# Above the Framing mask (10), below the Framing ratio label (30). The guides
# hide while DISP hides the native information.
[[layers]]
paint = "guides_paint"
setting = "STYLE"
order = 20
follow_disp = true
