name: Device report
description: Report the result of GRKit on a camera, as a pass or a failure.
body:
  - type: markdown
    attributes:
      value: |
        If the camera does not start, read the [recovery guide](https://github.com/ahonn/grkit/blob/main/resources/RECOVERY.md) first.
        For the site, the CLI, the documentation, or a feature request, open a blank issue.
  - type: dropdown
    id: camera
    attributes:
      label: Camera
      options:
        - GR III
        - GR III HDF
        - GR IIIx
        - GR IIIx HDF
        - GR IV
        - GR IV HDF
        - GR IV Monochrome
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: The version in the camera menu.
      placeholder: "1.11"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GRKit version
      description: The last row of the GRK menu shows the version. If GRK does not appear, give the version in the footer of grkit.app.
      placeholder: "1.1.1"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works
        - Works with problems
        - GRK does not appear
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: |
        Give the modules that you tested, the size and format of the card, what you expected, and what occurred.
        Copy all the lines of `GRKIT/REPORT.TXT` and `GRKIT/BOOT.TXT` here. If the card has `SCRIPT/GRKIT/INSTALL.ERR`, also copy all its lines.
        If the first line is 47, also attach a firmware dump. The [dump guide](https://github.com/ahonn/grkit/blob/main/resources/DUMP.md) tells you how to make one.
        Add photos of the screen if they help.
    validations:
      required: true
