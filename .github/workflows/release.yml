name: Release

# Builds one release from its tag: the site, the device-test packages, and a draft
# GitHub release that holds both. Merging the release pull request tags the merge
# commit and starts this workflow. Then the Deploy workflow publishes the site and
# the release. See docs/releasing.md.
on:
  pull_request:
    types: [closed]
    branches: [main]
  # A pushed tag releases that commit as it is.
  push:
    tags: ['v*']
  # Builds an existing tag again, for example with the firmware backup.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true
      firmware_source:
        description: Firmware source. "auto" uses the private backup only if the Ricoh download fails.
        type: choice
        options: [auto, backup]
        default: auto

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged &&
       github.event.pull_request.head.ref == 'release' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Resolve the release tag
        id: tag
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push)
              tag="$GITHUB_REF_NAME"
              sha="$GITHUB_SHA"
              ;;
            workflow_dispatch)
              tag="$INPUT_TAG"
              sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
              ;;
            pull_request)
              version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
              test -n "$version"
              tag="v$version"
              sha="$MERGE_SHA"
              # A tag that the workflow token creates does not start another run.
              if existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null); then
                if [ "$existing" != "$sha" ]; then
                  echo "::error::$tag already points at $existing."
                  exit 1
                fi
              else
                gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha" > /dev/null
              fi
              ;;
          esac
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$tag is not a release tag such as v0.1.0."
            exit 1
          fi
          # Release only commits on main.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "::error::$tag ($sha) is not on main."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  tests:
    needs: tag
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.tag.outputs.sha }}

  build:
    needs: tag
    runs-on: ubuntu-24.04
    env:
      FIRMWARE_BASE_URL: https://www.ricoh-imaging.co.jp/resources/japan/support/download/digital/FIRMWARE
      GR3_ZIP_SHA256: e895b439e4b3b96ac04f50072f02a63061ec7de5dcc1b070890baa09bc659470
      GR4_ZIP_SHA256: ded47aa6385886e4b1f8f41f8551866ab0f1ecd0aef89934a43ef0e456539e8f
      # A private repository holds the same zips as release assets, one tag for each
      # target. See docs/releasing.md.
      FIRMWARE_BACKUP_REPO: ${{ vars.FIRMWARE_BACKUP_REPO }}
      LLVM_KEY_FINGERPRINT: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - name: Check that the tag matches the version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Cargo.toml gives version $version, but the tag is $TAG."
            exit 1
          fi
      - run: rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
      - run: rustup default 1.92.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: sh web/scripts/install-wasm-bindgen.sh
      - name: Build the web page
        working-directory: web
        env:
          # Adds Plausible analytics when the variable gives its origin.
          PLAUSIBLE_HOST: ${{ vars.PLAUSIBLE_HOST }}
        run: |
          pnpm install --frozen-lockfile
          pnpm wasm
          pnpm build
      - name: Install LLVM 21
        run: |
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.asc" | grep --quiet "^fpr:::::::::$LLVM_KEY_FINGERPRINT:"
          sudo gpg --dearmor --output /usr/share/keyrings/llvm.gpg "$RUNNER_TEMP/llvm.asc"
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install --yes clang-21 lld-21
      - run: cargo build --release --locked -p grkit-cli
      - run: target/release/grkit doctor --clang clang-21 --lld ld.lld-21
      - name: Build the runtimes and effects from the official firmware
        env:
          FIRMWARE_SOURCE: ${{ inputs.firmware_source }}
          BACKUP_TOKEN: ${{ secrets.FIRMWARE_BACKUP_TOKEN }}
        run: |
          firmware="$RUNNER_TEMP/firmware"
          mkdir "$firmware"
          trap 'rm -rf "$firmware"' EXIT
          # fetch ZIP SHA256 TAG: download an official zip, or its backup, into $firmware.
          fetch() {
            zip="$firmware/$1"
            sum="$2"
            check() { echo "$sum  $zip" | sha256sum --check --strict; }
            if [ "$FIRMWARE_SOURCE" = backup ] \
              || ! curl --fail --location --silent --show-error --retry 3 -o "$zip" "$FIRMWARE_BASE_URL/$1" \
              || ! check; then
              if [ "$FIRMWARE_SOURCE" != backup ]; then
                echo "::warning::The Ricoh download of $1 failed or changed. The build uses the private backup."
              fi
              if [ -z "$FIRMWARE_BACKUP_REPO" ] || [ -z "$BACKUP_TOKEN" ]; then
                echo "::error::No firmware backup is configured."
                exit 1
              fi
              rm -f "$zip"
              GH_TOKEN="$BACKUP_TOKEN" gh release download "$3" \
                --repo "$FIRMWARE_BACKUP_REPO" --pattern "$1" --dir "$firmware"
              check
            fi
          }
          fetch gr3_v210.zip "$GR3_ZIP_SHA256" gr3-2.10
          fetch gr4_v111.zip "$GR4_ZIP_SHA256" gr4-1.11
          unzip -q "$firmware/gr3_v210.zip" fwdc239b.bin -d "$firmware"
          unzip -q "$firmware/gr4_v111.zip" fwdc248b.bin -d "$firmware"
          target/release/grkit build --target gr3-2.10 --firmware "$firmware/fwdc239b.bin" \
            --out "$RUNNER_TEMP/runtime-gr3" --clang clang-21 --lld ld.lld-21
          target/release/grkit build --target gr4-1.11 --firmware "$firmware/fwdc248b.bin" \
            --out "$RUNNER_TEMP/runtime-gr4" --clang clang-21 --lld ld.lld-21
          target/release/grkit site --build "$RUNNER_TEMP/runtime-gr3" --out site
          target/release/grkit site --build "$RUNNER_TEMP/runtime-gr4" --out site
          target/release/grkit effects publish --source effects --firmware "$firmware/fwdc239b.bin" \
            --out site/effects/gr3-2.10
          target/release/grkit effects publish --source effects --target gr4-1.11 \
            --firmware "$firmware/fwdc248b.bin" --out site/effects/gr4-1.11
      - name: Build the installation guides
        run: |
          sh .github/scripts/install-guide-tools.sh "$RUNNER_TEMP/guide-tools"
          sh .github/scripts/build-guides.sh target/release/grkit "$RUNNER_TEMP/guide-tools" site/guides
      - name: Add the web page to the site
        run: |
          for path in web/dist/* web/dist/.[!.]*; do
            [ -e "$path" ] || continue
            if [ -e "site/${path#web/dist/}" ]; then
              echo "::error::The web build and the site data both have ${path#web/dist/}."
              exit 1
            fi
          done
          cp -R web/dist/. site/
      - name: Package the published runtime for device testing
        run: |
          mkdir "$RUNNER_TEMP/no-effects"
          for pair in gr3:gr3-2.10 gr3x:gr3-2.10 gr4:gr4-1.11; do
            camera="${pair%%:*}"
            target/release/grkit package --build "site/runtime/${pair#*:}" --camera "$camera" \
              --effects "$RUNNER_TEMP/no-effects" --guide "site/guides/$camera/en.pdf" \
              --out "GRKit-device-test-$camera.zip"
            target/release/grkit verify "GRKit-device-test-$camera.zip"
          done
      - name: Check the version of each runtime
        run: |
          for manifest in site/runtime/*/build.json; do
            if [ "v$(jq -r .version "$manifest")" != "$TAG" ]; then
              echo "::error::$manifest does not give version ${TAG#v}."
              exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          if-no-files-found: error
          # The publish job copies it into the draft release.
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test
          path: GRKit-device-test-*.zip
          if-no-files-found: error
          retention-days: 3

  # The draft release keeps the tested bytes without an expiry date. Deploy takes
  # the site from it.
  publish:
    needs: [tag, tests, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: device-test
          path: device-test
      - name: Create or update the draft release
        run: |
          set -euo pipefail
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != true ]; then
              echo "::error::$TAG is already published. A published release is not replaced."
              exit 1
            fi
          else
            if sh .github/scripts/changelog-section.sh "${TAG#v}" > "$RUNNER_TEMP/notes.md"; then
              notes=(--notes-file "$RUNNER_TEMP/notes.md")
            else
              notes=(--generate-notes)
            fi
            gh release create "$TAG" --verify-tag --draft --title "GRKit $TAG" "${notes[@]}"
          fi
          tar -czf "$RUNNER_TEMP/site.tar.gz" -C site .
          gh release upload "$TAG" "$RUNNER_TEMP/site.tar.gz" device-test/GRKit-device-test-*.zip --clobber
      - name: Summary
        run: echo "The draft release $TAG holds the site and the device-test packages." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [tag, publish]
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
