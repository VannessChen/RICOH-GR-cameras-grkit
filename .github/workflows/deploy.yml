name: Deploy

# Publishes the site of a release, then publishes the draft GitHub release.
# Release calls this workflow when it has built a tag. Start it by hand to deploy
# a release again, for example to go back to an earlier version.
#
# The workflow commits the site to the `site` branch. Cloudflare Pages deploys
# each commit on that branch through its Git integration, so the repository holds
# no Cloudflare credentials. The workflow then waits until SITE_URL serves the
# version of the tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # One deployment at a time. A later run waits for the current one.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check the release
        id: release
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a release tag such as v0.1.0."
            exit 1
          fi
          if [ -z "$SITE_URL" ]; then
            echo "::error::Set the repository variable SITE_URL. See docs/releasing.md."
            exit 1
          fi
          if ! release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,author,assets \
            --jq '[.isDraft, .author.login, ([.assets[].name] | join("/"))] | @tsv'); then
            echo "::error::There is no release $TAG. The Release workflow creates it."
            exit 1
          fi
          IFS=$'\t' read -r draft author assets <<< "$release"
          # Releases before 1.2.0 name the site site.tar.gz.
          site=
          for name in "GRKit-${TAG#v}-site.tar.gz" site.tar.gz; do
            case "/$assets/" in */"$name"/*) site="$name"; break ;; esac
          done
          echo "Release $TAG: draft $draft, author $author, site ${site:-none}"
          if [ "$author" != 'github-actions[bot]' ] || [ -z "$site" ]; then
            echo "::error::$TAG was not made by the Release workflow, or it has no site archive."
            exit 1
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"
      # The scripts of the commit that runs this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          sparse-checkout: .github/scripts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: site
          path: site
      - name: Commit the site to the site branch
        working-directory: site
        env:
          SITE_ARCHIVE: ${{ steps.release.outputs.site }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SITE_ARCHIVE" --dir "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/site"
          tar -xzf "$RUNNER_TEMP/$SITE_ARCHIVE" -C "$RUNNER_TEMP/site"
          sh ../source/.github/scripts/commit-site.sh "$RUNNER_TEMP/site" "deploy $TAG"
      - name: Wait until the site serves the release
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Each runtime of the release gives its version. The first one is enough.
          runtime=$(find "$RUNNER_TEMP/site/runtime" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | head -n 1)
          test -n "$runtime"
          # Cloudflare Pages builds the commit, then switches production to it.
          for attempt in $(seq 90); do
            served=$(curl --fail --silent --show-error \
              "$SITE_URL/runtime/$runtime/build.json?run=$GITHUB_RUN_ID-$attempt" | jq -r .version) || served=
            if [ "$served" = "$version" ]; then
              echo "$SITE_URL serves $TAG."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE_URL does not serve $TAG after 15 minutes. Examine the deployment of the site branch in Cloudflare Pages."
          exit 1
      - name: Publish the release
        if: steps.release.outputs.draft == 'true'
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
