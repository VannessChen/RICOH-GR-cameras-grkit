name: Deploy

# Publishes the site of a tested release, then publishes the draft GitHub release.
# Starting this workflow is the approval step, so it deploys the bytes that were
# tested. A published release can be deployed again, for example to go back to an
# earlier version.
#
# The workflow commits the site to the `site` branch. Cloudflare Pages deploys
# each commit on that branch through its Git integration, so the repository holds
# no Cloudflare credentials. The workflow then waits until SITE_URL serves the
# version of the tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose device-test packages passed, for example v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check the release
        id: release
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a release tag such as v0.1.0."
            exit 1
          fi
          if [ -z "$SITE_URL" ]; then
            echo "::error::Set the repository variable SITE_URL. See docs/releasing.md."
            exit 1
          fi
          if ! release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,author,assets \
            --jq '[.isDraft, .author.login, ([.assets[].name] | index("site.tar.gz") != null)] | @tsv'); then
            echo "::error::There is no release $TAG. The Release workflow creates it."
            exit 1
          fi
          IFS=$'\t' read -r draft author site <<< "$release"
          echo "Release $TAG: draft $draft, author $author, site $site"
          if [ "$author" != 'github-actions[bot]' ] || [ "$site" != true ]; then
            echo "::error::$TAG was not made by the Release workflow, or it has no site.tar.gz."
            exit 1
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: site
          path: site
      - name: Commit the site to the site branch
        working-directory: site
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern site.tar.gz --dir "$RUNNER_TEMP"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf "$RUNNER_TEMP/site.tar.gz" -C .
          git add --all
          if git diff --cached --quiet; then
            echo "The site branch already holds the site of $TAG."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --message "deploy $TAG"
          git push origin HEAD:site
      - name: Wait until the site serves the release
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Cloudflare Pages builds the commit, then switches production to it.
          for attempt in $(seq 90); do
            served=$(curl --fail --silent --show-error \
              "$SITE_URL/runtime/gr3-2.10/build.json?run=$GITHUB_RUN_ID-$attempt" | jq -r .version) || served=
            if [ "$served" = "$version" ]; then
              echo "$SITE_URL serves $TAG."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE_URL does not serve $TAG after 15 minutes. Examine the deployment of the site branch in Cloudflare Pages."
          exit 1
      - name: Publish the release
        if: steps.release.outputs.draft == 'true'
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
