# cargo-deny policy. CI runs `cargo deny check` with this file.

[graph]
all-features = true

[advisories]
# Each ignored advisory needs a reason. Remove the entry when the dependency is updated.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained. ab_glyph uses it only to parse the bundled Roboto Condensed fonts, which are trusted input." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
# The lockfile has no duplicate crate versions. Add a `skip` entry with a reason if an update needs one.
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
